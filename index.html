<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vale Joyas & Co.</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="main-header">
        <img src="https://ibb.co/C5wWrwVw" alt="Vale Joyas Logo" class="logo-fullwidth">
    </header>

    <main class="catalog-container">
        
        <section class="catalog-section" onclick="openModal('modal-bikinis')">
            <div class="image-wrapper">
                <img src="https://ibb.co/B5pN1b3h" alt="Portaba Bikinis y Corales">
                <div class="section-overlay">
                    <h2>Bikinis y Corales</h2>
                </div>
            </div>
        </section>

        <section class="catalog-section" onclick="openModal('modal-medias')">
            <div class="image-wrapper">
                <img src="https://ibb.co/SDy556Zm" alt="Portada Medias y Zoquetes">
                <div class="section-overlay">
                    <h2>Medias y Zoquetes</h2>
                </div>
            </div>
        </section>

        <section class="catalog-section" onclick="openModal('modal-sostenes')">
            <div class="image-wrapper">
                <img src="https://ibb.co/KxDtC2GR" alt="Portada Sostenes">
                <div class="section-overlay">
                    <h2>Sostenes</h2>
                </div>
            </div>
        </section>

    </main>

    <div id="modal-bikinis" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('modal-bikinis')">&times;</span>
            <h2>Bikinis y Corales</h2>
            <p class="modal-subtitle">Próximamente la colección completa</p>
            <div class="products-grid" id="grid-bikinis">
                <div class="product-card-placeholder">Cargando catálogo...</div>
            </div>
        </div>
    </div>

    <div id="modal-medias" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('modal-medias')">&times;</span>
            <h2>Medias y Zoquetes</h2>
            <p class="modal-subtitle">Próximamente la colección completa</p>
            <div class="products-grid" id="grid-medias">
                <div class="product-card-placeholder">Cargando catálogo...</div>
            </div>
        </div>
    </div>

    <div id="modal-sostenes" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('modal-sostenes')">&times;</span>
            <h2>Sostenes</h2>
            <p class="modal-subtitle">Próximamente la colección completa</p>
            <div class="products-grid" id="grid-sostenes">
                <div class="product-card-placeholder">Cargando catálogo...</div>
            </div>
        </div>
    </div>

    <a href="https://wa.me/59898808548" class="whatsapp-float" target="_blank" rel="noopener noreferrer" title="Contáctanos por WhatsApp">
        <i class="fab fa-whatsapp"></i>
    </a>

    <script src="script.js"></script>
</body>
</html>
