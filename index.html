<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vale Joyas & Co.</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="main-header">
        <div class="logo-container">
            <img src="https://i.ibb.co/N6F74FWF/IMG-20260529-230115.jpg" alt="Vale Joyas Logo" class="logo-fullwidth">
        </div>
    </header>

    <main class="catalog-container">
        
        <section class="catalog-section" onclick="openModal('modal-bikinis')">
            <div class="image-wrapper">
                <img src="https://i.ibb.co/Dfk0Lh7S/IMG-20260529-230316.jpg" alt="Bikinis y Corales">
                <div class="section-overlay">
                    <h2>Bikinis y Corales</h2>
                </div>
            </div>
        </section>

        <section class="catalog-section" onclick="openModal('modal-medias')">
            <div class="image-wrapper">
                <img src="https://i.ibb.co/bjmQQ6Gv/IMG-20260529-230231.jpg" alt="Medias y Zoquetes">
                <div class="section-overlay">
                    <h2>Medias y Zoquetes</h2>
                </div>
            </div>
        </section>

        <section class="catalog-section" onclick="openModal('modal-sostenes')">
            <div class="image-wrapper">
                <img src="https://i.ibb.co/VYxFXgNr/IMG-20260529-230255.jpg" alt="Sostenes">
                <div class="section-overlay">
                    <h2>Sostenes</h2>
                </div>
            </div>
        </section>

    </main>

    <div id="modal-bikinis" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('modal-bikinis')">&times;</span>
            <h2>Bikinis y Corales</h2>
            <p class="modal-subtitle">Colección Exclusiva</p>
            <div class="products-grid"></div>
        </div>
    </div>

    <div id="modal-medias" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('modal-medias')">&times;</span>
            <h2>Medias y Zoquetes</h2>
            <p class="modal-subtitle">Colección Exclusiva</p>
            <div class="products-grid"></div>
        </div>
    </div>

    <div id="modal-sostenes" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('modal-sostenes')">&times;</span>
            <h2>Sostenes</h2>
            <p class="modal-subtitle">Colección Exclusiva</p>
            <div class="products-grid"></div>
        </div>
    </div>

    <a href="https://wa.me/59898808548" class="whatsapp-float" target="_blank" rel="noopener noreferrer">
        <i class="fab fa-whatsapp"></i>
    </a>

    <script src="productos.js"></script>
    <script src="script.js"></script>
</body>
</html>
