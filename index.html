        // Conectar con la API remota de JsonBin
        async function loadCatalogFromRemote() {
            try {
                const response = await fetch(JSON_URL, {
                    method: 'GET',
                    headers: {
                        'X-Master-Key': MASTER_KEY,
                        'X-Bin-Meta': 'false'
                    }
                });
                
                if (!response.ok) {
                    throw new Error("Respuesta de red no válida");
                }

                catalogData = await response.json();
                console.log("Catálogo remoto cargado con éxito.");
                renderCatalog();
                
            } catch (error) {
                console.warn("Error cargando base remota, usando catálogo de respaldo local:", error);
                catalogData = backupCatalogData;
                renderCatalog();
            }
        }

            for (const [category, products] of Object.entries(catalogData)) {

                let html = "";
                products.forEach(p => {
                    // Si la imagen remota empieza con http se usa directamente, sino se asume local
                    const imageSource = p.img.startsWith('http') ? p.img : p.img;
                    
                    html += `
                        <div class="product-card">
                            <div class="product-image" style="background-image: linear-gradient(rgba(255,255,255,0.1), rgba(0,0,0,0.02)), url('${imageSource}');">

                                    <button class="btn-add" onclick="addToCart('${p.name}', ${p.price})">Agregar</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            }
        }
