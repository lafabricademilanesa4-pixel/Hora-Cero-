<div id="cat-conjuntos" class="category-content active"></div>
<div id="cat-bombachas" class="category-content"></div>
<div id="cat-soutienes" class="category-content"></div>
<div id="cat-medias" class="category-content"></div>
<div id="cat-dormir" class="category-content"></div>

<!-- ================================================================= -->
<!-- 2. LÓGICA EN SEGUNDO PLANO (JAVASCRIPT)                          -->
<!-- El navegador leerá esto internamente para renderizar las prendas -->
<!-- ================================================================= -->
<script>
// CONFIGURACIÓN DE TU BASE DE DATOS REMOTA (JSONBIN.IO)
const BIN_ID = "6a28d3aff5f4af5e29d5ae82"; 
const JSON_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
const MASTER_KEY = "$2a$10$qiyVtGY2eFG68QFFYJo2/.me5EmiyQdWsnrAHrXL5UZaXuSJKrwpW"; 

// NÚMERO DE TELÉFONO DE NÜMIA
const WHATSAPP_PHONE = "59898808548"; 

let catalogData = {};
let cart = [];

// Función para conectar y descargar los productos en tiempo real desde internet
async function loadCatalogFromRemote() {
    try {
        const response = await fetch(JSON_URL, {
            method: 'GET',
            headers: {
                'X-Master-Key': MASTER_KEY,
                'X-Bin-Meta': 'false'
            }
        });
        
        if (!response.ok) {
            throw new Error("No se pudo conectar con JsonBin. Revisá la Master Key.");
        }

        catalogData = await response.json();
        renderCatalog();
        
    } catch (error) {
        console.error("Error al cargar el catálogo:", error);
    }
}

// Dibuja las tarjetas de producto dinámicamente dentro de los contenedores HTML
function renderCatalog() {
    for (const [category, products] of Object.entries(catalogData)) {
        const container = document.getElementById(`cat-${category}`);
        if (!container) continue;
        
        let html = "";
        products.forEach(p => {
            html += `
                <div class="product-card">
                    <div class="product-image" style="background-image: url('${p.img}');"></div>
                    <div class="product-info">
                        <div class="product-title">${p.name}</div>
                        <div class="product-desc">${p.desc}</div>
                        <div class="product-meta">
                            <div class="product-price">$ ${p.price}</div>
                            <button class="btn-add" onclick="addToCart('${p.name}', ${p.price})">Agregar</button>
                        </div>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }
}

// Cambiar de categoría activa al tocar las pestañas
function switchCategory(category) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.category-content').forEach(content => content.classList.remove('active'));
    
    event.currentTarget.classList.add('active');
    const targetContent = document.getElementById(`cat-${category}`);
    if (targetContent) targetContent.classList.add('active');
}

// Agregar productos seleccionados al carrito
function addToCart(name, price) {
    const existing = cart.find(item => item.name === name);
    if (existing) {
        existing.qty++;
    } else {
        cart.push({ name, price, qty: 1 });
    }
    updateCartUI();
}

// Modificar cantidades de artículos (+ / -) dentro del carrito
function updateQty(name, delta) {
    const item = cart.find(item => item.name === name);
    if (item) {
        item.qty += delta;
        if (item.qty <= 0) {
            cart = cart.filter(i => i.name !== name);
        }
    }
    updateCartUI();
}

// Actualizar visualmente la lista flotante del carrito y sus sumas totales
function updateCartUI() {
    const cartItemsContainer = document.getElementById('cart-items');
    const cartCount = document.getElementById('cart-count');
    const cartTotal = document.getElementById('cart-total');
    
    let totalItems = 0;
    let totalPrice = 0;
    let html = "";
    
    cart.forEach(item => {
        totalItems += item.qty;
        totalPrice += item.price * item.qty;
        html += `
            <div class="cart-item">
                <div>
                    <strong>${item.name}</strong><br>
                    <span style="color:#888;">$ ${item.price} c/u</span>
                </div>
                <div class="cart-item-actions">
                    <button onclick="updateQty('${item.name}', -1)">-</button>
                    <span>${item.qty}</span>
                    <button onclick="updateQty('${item.name}', 1)">+</button>
                </div>
            </div>
        `;
    });
    
    cartItemsContainer.innerHTML = html || "<p style='color:#888; text-align:center;'>Tu carrito está vacío.</p>";
    cartCount.innerText = totalItems;
    cartTotal.innerText = totalPrice;
}

// Abrir o cerrar la pestaña desplegable del carrito
function toggleCart() {
    const modal = document.getElementById('cart-modal');
    modal.classList.toggle('active');
}

// Procesar el pedido estructurado y redirigir al WhatsApp de la tienda
function sendOrder() {
    if (cart.length === 0) {
        alert("El carrito está vacío.");
        return;
    }
    
    let message = "Olá NÜMIA! Me gustaría hacer el siguiente pedido:\n\n";
    let total = 0;
    
    cart.forEach(item => {
        const subtotal = item.price * item.qty;
        message += `• ${item.qty}x ${item.name} ($${item.price} c/u) = $${subtotal}\n`;
        total += subtotal;
    });
    
    message += `\n*Total estimado: $${total}*`;
    
    const encodedText = encodeURIComponent(message);
    window.open(`https://wa.me/${WHATSAPP_PHONE}?text=${encodedText}`, '_blank');
}

// Disparar de forma automática la descarga de artículos remotos al cargar la pestaña
loadCatalogFromRemote();
                                                  </script>
