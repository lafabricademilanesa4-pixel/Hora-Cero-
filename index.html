<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Fábrica de las Milanesas</title>
    <style>
        * {
            box-shadow: none;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background-color: #121212;
            color: #eeeeee;
            padding-bottom: 100px;
        }

        header {
            background: linear-gradient(180deg, #1a1a1a 0%, #111111 100%);
            padding: 25px 15px;
            text-align: center;
            border-bottom: 3px solid #ff9f43;
        }

        header h1 {
            font-size: 26px;
            color: #ff9f43;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        header p {
            font-size: 14px;
            color: #aaa;
            margin-top: 5px;
        }

        /* Categorías Desplazables Horizontalmente (Ideal para celular) */
        .categories-container {
            position: sticky;
            top: 0;
            background-color: #111;
            padding: 10px 0;
            z-index: 10;
            overflow-x: auto;
            white-space: nowrap;
            border-bottom: 1px solid #222;
            -webkit-overflow-scrolling: touch;
        }

        .categories-container::-webkit-scrollbar {
            display: none;
        }

        .category-btn {
            display: inline-block;
            background: #222;
            color: #aaa;
            padding: 10px 18px;
            margin: 0 5px;
            border-radius: 20px;
            border: 1px solid #333;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        .category-btn.active {
            background: #ff9f43;
            color: #111;
            border-color: #ff9f43;
        }

        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .products-section {
            display: none;
        }

        .products-section.active {
            display: block;
        }

        .product-card {
            background: #1e1e1e;
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid #2a2a2a;
        }

        .product-image {
            width: 100%;
            height: 180px;
            background-color: #2d2d2d;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-weight: bold;
            font-size: 13px;
            background-size: cover;
            background-position: center;
        }

        .product-info {
            padding: 15px;
        }

        .product-title {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 5px;
        }

        .product-desc {
            font-size: 13px;
            color: #999;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .product-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .product-price {
            font-size: 19px;
            color: #ff9f43;
            font-weight: bold;
        }

        .btn-add {
            background-color: #ff9f43;
            color: #111;
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-add:active {
            background-color: #f39c12;
        }

        /* Barra Inferior Fija del Carrito */
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #1a1a1a;
            border-top: 3px solid #25d366;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
        }

        .cart-summary {
            display: flex;
            flex-direction: column;
        }

        .cart-count {
            font-size: 13px;
            color: #aaa;
        }

        .cart-total {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
        }

        .btn-whatsapp {
            background-color: #25d366;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.2);
        }

        .btn-whatsapp.disabled {
            background-color: #444;
            color: #777;
            pointer-events: none;
            box-shadow: none;
        }

        .toast {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #25d366;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 1000;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

    <header>
        <h1>La Fábrica de las Milanesas</h1>
        <p>Armá tu carrito y mandanos el pedido directo a WhatsApp</p>
    </header>

    <div class="toast" id="toast">¡Agregado al pedido!</div>

    <!-- Menú de Categorías -->
    <div class="categories-container">
        <button class="category-btn active" onclick="switchCategory('carne')">Milanesas de Carne</button>
        <button class="category-btn" onclick="switchCategory('pollo')">Milanesas de Pollo</button>
        <button class="category-btn" onclick="switchCategory('supremas')">Supremas Rellenas</button>
        <button class="category-btn" onclick="switchCategory('guarniciones')">Guarniciones</button>
        <button class="category-btn" onclick="switchCategory('bebidas')">Bebidas y Postres</button>
    </div>

    <div class="container">
        
        <!-- SECCIÓN 1: CARNE -->

        <!-- SECCIÓN 2: POLLO -->

        <!-- SECCIÓN 3: SUPREMAS -->
        <div id="cat-supremas" class="products-section"></div>

        <!-- SECCIÓN 4: GUARNICIONES -->
        <div id="cat-guarniciones" class="products-section"></div>

        <!-- SECCIÓN 5: BEBIDAS -->
        <div id="cat-bebidas" class="products-section"></div>

    </div>

    <!-- Barra de Carrito Fijo Inferior -->

        <div class="cart-summary">
            <span class="cart-count" id="cart-count">0 artículos</span>
            <span class="cart-total" id="cart-total">Total: $0</span>
        </div>
        <a href="#" id="whatsapp-link" class="btn-whatsapp disabled" target="_blank" onclick="sendOrder(event)">
            Confirmar Pedido
        </a>
    </div>

    <script>

                { id: "p7", name: "Milanesa Pollo con Champiñones", desc: "Crema intensa con champiñones fileteados.", price: 490, img: "imagenes/pollo_7.jpg" },
                { id: "p8", name: "Milanesa Pollo Club Social", desc: "Con palta, tomate y aderezo especial de la casa.", price: 460, img: "imagenes/pollo_8.jpg" },

                { id: "g9", name: "Aros de Cebolla Crujientes", desc: "Porción ideal para picar antes de la mila.", price: 190, img: "imagenes/guarnicion_9.jpg" },
                { id: "g10", name: "Huevo Frito Extra (x2)", desc: "Dos unidades al punto justo para sumar a tu plato.", price: 60, img: "imagenes/guarnicion_10.jpg" }
            ],
            bebidas: [
                { id: "b1", name: "Refresco 600ml", desc: "Línea Coca Cola o Pepsi según stock.", price: 110, img: "imagenes/bebida_1.jpg" },
                { id: "b2", name: "Refresco de 1.5L", desc: "Ideal para los pedidos familiares.", price: 180, img: "imagenes/bebida_2.jpg" },
                { id: "b3", name: "Agua Mineral 600ml", desc: "Con o sin gas.", price: 90, img: "imagenes/bebida_3.jpg" },
                { id: "b4", name: "Cerveza Nacional 1L", desc: "Bien helada para acompañar la cena.", price: 220, img: "imagenes/bebida_4.jpg" },
                { id: "b5", name: "Cerveza Artesanal Lata", desc: "Variedades APA, IPA o Rubia común.", price: 150, img: "imagenes/bebida_5.jpg" },
                { id: "b6", name: "Flan Casero con Dulce", desc: "Con dulce de leche uruguayo.", price: 130, img: "imagenes/bebida_6.jpg" },
                { id: "b7", name: "Chajá de Postre", desc: "El clásico postre con merengue y durazno.", price: 160, img: "imagenes/bebida_7.jpg" },
                { id: "b8", name: "Mousse de Chocolate", desc: "Cremosa, suave y bien chocolatosa.", price: 140, img: "imagenes/bebida_8.jpg" },
                { id: "b9", name: "Ensalada de Frutas", desc: "Frutas de estación picadas, 100% natural.", price: 130, img: "imagenes/bebida_9.jpg" },
                { id: "b10", name: "Jugo Natural de Naranja", desc: "Exprimido en el momento (500ml).", price: 140, img: "imagenes/bebida_10.jpg" }
            ]
        };

        let cart = [];

        // Generar las tarjetas en la pantalla automáticamente
        function renderCatalog() {
            for (const [category, products] of Object.entries(catalogData)) {
                const container = document.getElementById(`cat-${category}`);
                let html = "";
                
                products.forEach(p => {
                    html += `
                        <div class="product-card">
                            <div class="product-image" style="background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('${p.img}');">
                                📷 [Clic para subir: ${p.img}]
                            </div>
                            <div class="product-info">
                                <div class="product-title">${p.name}</div>
                                <div class="product-desc">${p.desc}</div>
                                <div class="product-meta">
                                    <div class="product-price">$ ${p.price}</div>
                                    <button class="btn-add" onclick="addToCart('${p.name}', ${p.price})">Agregar</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            }
        }

        // Cambiar entre pestañas de categorías
        function switchCategory(categoryName) {
            document.querySelectorAll('.product-grid, .products-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.category-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(`cat-${categoryName}`).classList.add('active');
            event.target.classList.add('active');
        }

        function addToCart(name, price) {
            cart.push({ name, price });
            updateCartUI();
            
            // Mostrar cartelito temporal arriba
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 1200);
        }

        function updateCartUI() {
            const countEl = document.getElementById('cart-count');
            const totalEl = document.getElementById('cart-total');
            const wsLink = document.getElementById('whatsapp-link');

            countEl.innerText = `${cart.length} ${cart.length === 1 ? 'artículo' : 'artículos'}`;
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            totalEl.innerText = `Total: $${total}`;

            if (cart.length > 0) {
                wsLink.classList.remove('disabled');
            } else {
                wsLink.classList.add('disabled');
            }
        }

        function sendOrder(e) {
            if (cart.length === 0) {
                e.preventDefault();
                return;
            }

            let itemCounts = {};
            cart.forEach(item => itemCounts[item.name] = (itemCounts[item.name] || 0) + 1);
            let total = cart.reduce((sum, item) => sum + item.price, 0);

            // Construcción del formato del mensaje para WhatsApp
            let text = "*¡Hola! Me gustaría hacer el siguiente pedido en La Fábrica de las Milanesas:*\\n\\n";
            for (const [name, qty] of Object.entries(itemCounts)) {
                text += `• *${qty}x* ${name}\\n`;
            }
            text += `\\n Gran Total: *$${total}*\\n\\n_Enviado desde el catálogo web._`;

            document.getElementById('whatsapp-link').href = `https://wa.me/${WHATSAPP_PHONE}?text=${encodeURIComponent(text)}`;
        }

        // Iniciar catálogo al cargar la página
        renderCatalog();
    </script>
</body>
    </html>
